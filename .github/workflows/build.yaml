name: Build

on:
  workflow_dispatch: ~
  push:
    branches: [main]
  pull_request: ~
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/phpyh/php
  # Keep in sync with jobs.publish.if
  PUSH: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'phpyh' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.5.0

      - name: Check Dockerfile with BuildKit
        run: docker buildx build --check .

      - name: Lint shell scripts with ShellCheck
        run: shellcheck tests/*.sh

      - name: Lint workflows with actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  build:
    name: Build ${{ matrix.php }} ${{ matrix.arch }}
    needs: lint
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # TODO: remove 8.2 after its security support ends on 2026-12-31, the last published image stays available
        php: &php ['8.2', '8.3', '8.4', '8.5', '8.6']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          # TODO: remove once PHP 8.6 is released and Xdebug 3.6 is stable
          - php: '8.6'
            base: 8.6-rc
            xdebug: xdebug/xdebug@3.6.0alpha1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          platforms: linux/${{ matrix.arch }}
          build-args: &build-args |
            PHP_VERSION=${{ matrix.base || matrix.php }}
            XDEBUG=${{ matrix.xdebug }}
          tags: phpyh-php:test
          load: true
          # Weekly rebuild without GHA cache picks up new releases of extensions and tools.
          # The push step below reuses the layers from the local builder cache anyway.
          cache-from: ${{ github.event_name != 'schedule' && format('type=gha,scope=php-{0}-{1}', matrix.php, matrix.arch) || '' }}
          cache-to: type=gha,scope=php-${{ matrix.php }}-${{ matrix.arch }},mode=max

      - name: Smoke test
        run: tests/smoke.sh phpyh-php:test

      - name: Get full PHP version
        id: php
        run: echo "version=$(docker run --rm phpyh-php:test php -r 'echo PHP_VERSION;')" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: &meta |
            org.opencontainers.image.title=PHPyh PHP ${{ matrix.php }}
            org.opencontainers.image.description=PHP ${{ matrix.php }} image for development and CI with Composer, Xdebug and code quality tools
            org.opencontainers.image.version=${{ steps.php.outputs.version }}
          annotations: *meta

      - name: Login to GitHub container registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with: &login
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed untagged: the publish job tags the multi-platform index
      - name: Push image by digest
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          platforms: linux/${{ matrix.arch }}
          build-args: *build-args
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save build result
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.php.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          echo "$DIGEST" > "$RUNNER_TEMP/build/digest"
          echo "$VERSION" > "$RUNNER_TEMP/build/version"

      - name: Upload build result
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.php }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/build/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.php }}
    needs: [lint, build]
    # Same as env.PUSH (env is not available here); runs even if another PHP version failed to build
    if: ${{ !cancelled() && needs.lint.result == 'success' && github.ref == 'refs/heads/main' && github.repository_owner == 'phpyh' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: *php
    steps:
      - name: Download build results
        uses: actions/download-artifact@v8
        with:
          pattern: build-${{ matrix.php }}-*
          path: ${{ runner.temp }}/builds

      - name: Read build results
        id: php
        working-directory: ${{ runner.temp }}/builds
        run: |
          shopt -s nullglob
          builds=(build-*/)
          # Both platforms must be built, otherwise the previously published image stays as is
          test "${#builds[@]}" -eq 2
          test "$(sort -u ./*/version | wc -l)" -eq 1
          echo "version=$(cat ./build-*-amd64/version)" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # The image index is what GHCR shows on the package page
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ matrix.php }}
            type=raw,value=${{ steps.php.outputs.version }}
          annotations: *meta

      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with: *login

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push multi-platform image
        working-directory: ${{ runner.temp }}/builds
        run: |
          mapfile -t args < <(jq -r '(.tags[] | "--tag=" + .), (.annotations[] | "--annotation=" + .)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t images < <(sed "s|^|$IMAGE@|" ./*/digest)
          docker buildx imagetools create "${args[@]}" "${images[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:${{ matrix.php }}"
