on:
  workflow_dispatch: ~
  push:
    branches: [main]
  pull_request: ~
  schedule:
    - cron: '0 0 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4, 8.5, 8.6]
        include:
          # TODO: remove once PHP 8.6 is released and php:8.6-cli-alpine is available
          - php: 8.6
            base: 8.6-rc
    steps:
      - name: Get current timestamp
        id: timestamp
        run: echo "rfc3339=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          build-args: PHP_VERSION=${{ matrix.base || matrix.php }}
          tags: ghcr.io/phpyh/php:${{ matrix.php }}
          push: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'phpyh' }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.rfc3339 }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
