on:
  workflow_dispatch: ~
  push:
    branches: [main]
  pull_request: ~
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  packages: write

env:
  PUSH: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'phpyh' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']
        include:
          # TODO: remove once PHP 8.6 is released and Xdebug 3.6 is stable
          - php: '8.6'
            base: 8.6-rc
            xdebug: xdebug/xdebug@3.6.0alpha1
    steps:
      - name: Get current timestamp
        id: timestamp
        run: echo "rfc3339=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Login to GitHub container registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # No checkout: build-push-action uses the Git context of the current commit
      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=${{ matrix.base || matrix.php }}
            XDEBUG=${{ matrix.xdebug }}
          tags: ghcr.io/phpyh/php:${{ matrix.php }}
          push: ${{ env.PUSH == 'true' }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.rfc3339 }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Weekly rebuild from scratch picks up new releases of extensions and tools
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,scope=php-${{ matrix.php }},mode=max
